plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

version = mod_version
group   = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// the generated data was Fabric's datagen output, so it keeps its own root next to the hand-written resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run/1.21.11')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        register('client')
        register('server') {
            args '--nogui'
        }
        register('gameTestServer')
        register('data') {
            workingDir = layout.projectDirectory.dir('run-data/1.21.11')
            args '--mod', mod_id, '--all',
                 '--output', layout.projectDirectory.dir('src/generated/resources'),
                 '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

def sharedReplaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    forge_version          : forge_version,
    forge_version_range    : forge_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties sharedReplaceProperties
    filesMatching(['META-INF/mods.toml']) { expand sharedReplaceProperties + [project: project] }
}

// the MIT text has to travel with every copy that goes out
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE'))
}

tasks.named('jar', Jar).configure {
    manifest { attributes([
        'Specification-Title'     : mod_id,
        'Specification-Vendor'    : mod_authors,
        'Specification-Version'   : '1',
        'Implementation-Title'    : mod_id,
        'Implementation-Version'  : project.version,
        'Implementation-Vendor'   : mod_authors,
        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        'MixinConfigs'            : 'nekomasfixed.mixins.json,nekomasfixed.client.mixins.json'
    ])}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
